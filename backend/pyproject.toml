[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aureliuswu-agent-backend"
version = "0.8.0"
description = "Workspace-sandboxed personal Agent API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "pyinstaller>=6.14,<7"]

[project.scripts]
agent-eval = "app.evals.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

name: Release Windows

on:
  workflow_dispatch:
    inputs:
      rc_evidence_run_id:
        description: 'Successful same-commit run containing Siyi-RC-Acceptance-vVERSION (v16 required)'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag and accepted CI commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:GITHUB_REF.StartsWith('refs/tags/v')) {
            throw 'Release workflow must run from an immutable version tag.'
          }
          $version = (Get-Content VERSION -Raw -Encoding ascii).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Git tag $env:GITHUB_REF_NAME does not match VERSION=$version."
          }
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne $env:GITHUB_SHA) {
            throw "Checked out commit $sha does not match GITHUB_SHA $env:GITHUB_SHA."
          }
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=success&per_page=100" | ConvertFrom-Json
          $accepted = @($runs.workflow_runs | Where-Object {
            $_.name -eq 'CI' -and $_.head_sha -eq $sha -and $_.conclusion -eq 'success'
          })
          if ($accepted.Count -eq 0) {
            throw "No successful CI run is bound to release commit $sha."
          }
          $compactVersion = $version -replace '[^0-9A-Za-z]', ''
          "SIYI_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIYI_EVIDENCE_ROOT=build/v$compactVersion-evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release commit $sha is bound to CI run $($accepted[0].id)."
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: siyi/requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Prepare locked toolchain
        run: |
          python scripts/privacy_scan.py --tracked --history
          python scripts/check-release-metadata.py --release-preflight
          python -m venv siyi/.venv
          siyi/.venv/Scripts/python -m pip install -r siyi/requirements.lock
          siyi/.venv/Scripts/python -m pip install --no-deps -e siyi
      - name: Install locked frontend dependencies
        if: "!startsWith(env.SIYI_RELEASE_VERSION, '16.')"
        working-directory: desktop/frontend
        run: npm ci
      - name: Verify release source
        if: "!startsWith(env.SIYI_RELEASE_VERSION, '16.')"
        run: .\scripts\test.ps1
      - name: Download accepted upgrade baseline
        if: "!startsWith(env.SIYI_RELEASE_VERSION, '16.')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $current = [version]$version
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to enumerate previous GitHub releases.' }
          $candidates = @($releases | Where-Object {
            -not $_.draft -and
            -not $_.prerelease -and
            $_.tag_name -match '^v?\d+\.\d+\.\d+$' -and
            [version]($_.tag_name -replace '^v', '') -lt $current
          } | Sort-Object { [version]($_.tag_name -replace '^v', '') } -Descending)
          if ($candidates.Count -eq 0) {
            throw "No accepted GitHub release older than v$version is available for upgrade validation."
          }
          $previous = $candidates[0]
          $previousVersion = $previous.tag_name -replace '^v', ''
          $directory = Join-Path $PWD 'build\upgrade-baseline'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          gh release download $previous.tag_name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw "Failed to download upgrade baseline $($previous.tag_name)." }
          $nsis = @(Get-ChildItem -LiteralPath $directory -File | Where-Object {
            $_.Name -match [Regex]::Escape($previousVersion) -and $_.Name.EndsWith('-setup.exe', [StringComparison]::OrdinalIgnoreCase)
          })
          $msi = @(Get-ChildItem -LiteralPath $directory -File | Where-Object {
            $_.Name -match [Regex]::Escape($previousVersion) -and $_.Name.EndsWith('.msi', [StringComparison]::OrdinalIgnoreCase)
          })
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Previous release $($previous.tag_name) must contain exactly one NSIS and one MSI installer."
          }
          "SIYI_PREVIOUS_RELEASE_TAG=$($previous.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIYI_PREVIOUS_NSIS=$($nsis[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIYI_PREVIOUS_MSI=$($msi[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and smoke Windows packages
        if: "!startsWith(env.SIYI_RELEASE_VERSION, '16.')"
        run: .\scripts\build-desktop.ps1 -PreviousNsisInstaller $env:SIYI_PREVIOUS_NSIS -PreviousMsiInstaller $env:SIYI_PREVIOUS_MSI -AllowUnpairedPerformanceBaseline -ReleaseEvidence
      - name: Validate release evidence before upload
        if: "!startsWith(env.SIYI_RELEASE_VERSION, '16.')"
        run: |
          siyi/.venv/Scripts/python scripts/check-release-metadata.py --release
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata changed or became invalid after packaging.' }
          siyi/.venv/Scripts/python scripts/check-release-evidence.py --evidence-root $env:SIYI_EVIDENCE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer evidence is incomplete or unbound.' }
      - name: Verify v16 RC acceptance artifact provenance
        if: startsWith(env.SIYI_RELEASE_VERSION, '16.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RC_EVIDENCE_RUN_ID: ${{ inputs.rc_evidence_run_id || vars.SIYI_RC_EVIDENCE_RUN_ID }}
        run: |
          if ($env:RC_EVIDENCE_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw 'v16 publication requires an explicit accepted RC evidence run. Missing evidence is not a pass.'
          }
          $runMetadata = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-run.json'
          $attemptMetadata = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-attempt.json'
          $artifactMetadata = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-artifacts.json'
          $selectionReceipt = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-run-receipt.json'
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RC_EVIDENCE_RUN_ID" | Out-File -LiteralPath $runMetadata -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Selected RC run metadata is unavailable.' }
          $attempt = (Get-Content -LiteralPath $runMetadata -Raw | ConvertFrom-Json).run_attempt
          if ([string]$attempt -notmatch '^[1-9][0-9]*$') { throw 'RC run attempt is unavailable.' }
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RC_EVIDENCE_RUN_ID/attempts/$attempt" | Out-File -LiteralPath $attemptMetadata -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Explicit RC attempt metadata is unavailable.' }
          gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RC_EVIDENCE_RUN_ID/artifacts?per_page=100" | Out-File -LiteralPath $artifactMetadata -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Complete RC artifact metadata is unavailable.' }
          siyi/.venv/Scripts/python scripts/validate-rc-run.py --run-json $runMetadata --attempt-json $attemptMetadata --artifacts-json $artifactMetadata --artifact-name "Siyi-RC-Acceptance-v$env:SIYI_RELEASE_VERSION" --repository $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA --run-id $env:RC_EVIDENCE_RUN_ID --write-receipt $selectionReceipt
          if ($LASTEXITCODE -ne 0) { throw 'RC run must be formal main acceptance at the exact release commit.' }
          $selection = Get-Content -LiteralPath $selectionReceipt -Raw | ConvertFrom-Json
          "SIYI_RC_ARTIFACT_ID=$($selection.artifact.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIYI_RC_EVIDENCE_RUN_ID=$env:RC_EVIDENCE_RUN_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download source-bound v16 RC acceptance evidence
        if: startsWith(env.SIYI_RELEASE_VERSION, '16.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $selectionReceipt = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-run-receipt.json'
          $selection = Get-Content -LiteralPath $selectionReceipt -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-artifact.zip'
          $sha256 = $selection.artifact.digest.Substring(7)
          siyi/.venv/Scripts/python scripts/export-accepted-rc.py download-actions --repository $env:GITHUB_REPOSITORY --artifact-id $env:SIYI_RC_ARTIFACT_ID --sha256 $sha256 --size $selection.artifact.size_in_bytes --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'RC archive bytes differ from the selected immutable artifact digest or size.' }
          siyi/.venv/Scripts/python scripts/export-accepted-rc.py receive --archive $archive --directory "$env:SIYI_EVIDENCE_ROOT/rc-input" --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Verified RC archive failed the original bounded safe transport receiver.' }
      - name: Enforce total v16 RC gate before upload
        if: startsWith(env.SIYI_RELEASE_VERSION, '16.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runMetadata = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-run-after-download.json'
          $attemptMetadata = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-attempt-after-download.json'
          $artifactMetadata = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-artifact-after-download.json'
          $selectionReceipt = Join-Path $env:RUNNER_TEMP 'siyi-selected-rc-run-receipt.json'
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SIYI_RC_EVIDENCE_RUN_ID" | Out-File -LiteralPath $runMetadata -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'RC run could not be rechecked after download.' }
          $attempt = (Get-Content -LiteralPath $runMetadata -Raw | ConvertFrom-Json).run_attempt
          if ([string]$attempt -notmatch '^[1-9][0-9]*$') { throw 'RC run attempt is unavailable after download.' }
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SIYI_RC_EVIDENCE_RUN_ID/attempts/$attempt" | Out-File -LiteralPath $attemptMetadata -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Explicit RC attempt could not be rechecked after download.' }
          gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:SIYI_RC_ARTIFACT_ID" | Out-File -LiteralPath $artifactMetadata -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Selected RC artifact could not be rechecked after download.' }
          siyi/.venv/Scripts/python scripts/validate-rc-run.py --run-json $runMetadata --attempt-json $attemptMetadata --artifacts-json $artifactMetadata --artifact-name "Siyi-RC-Acceptance-v$env:SIYI_RELEASE_VERSION" --repository $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA --run-id $env:SIYI_RC_EVIDENCE_RUN_ID --expected-receipt $selectionReceipt
          if ($LASTEXITCODE -ne 0) { throw 'RC run attempt or provenance changed during download.' }
          siyi/.venv/Scripts/python scripts/import-accepted-rc.py --directory "$env:SIYI_EVIDENCE_ROOT/rc-input" --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Accepted candidate could not be safely materialized; nothing is rebuilt or overwritten.' }
          siyi/.venv/Scripts/python scripts/check-release-metadata.py --release --accepted-snapshot
          if ($LASTEXITCODE -ne 0) { throw 'Accepted candidate release metadata is invalid.' }
          siyi/.venv/Scripts/python scripts/check-release-evidence.py --evidence-root $env:SIYI_EVIDENCE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Accepted immutable installers lack actual lifecycle evidence.' }
          siyi/.venv/Scripts/python scripts/rc_gate.py --bundle "$env:SIYI_EVIDENCE_ROOT/accepted/rc-bundle.json" --model-identity "$env:SIYI_EVIDENCE_ROOT/accepted/default-model-identity.json"
          if ($LASTEXITCODE -ne 0) { throw 'Total v16 RC gate blocked upload. Candidate evidence does not authorize publication.' }
      - name: Upload release artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: Siyi-Windows-${{ github.ref_name }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            dist/release/agent-sbom.cdx.json
            dist/release/THIRD_PARTY_NOTICES.txt
            ${{ env.SIYI_EVIDENCE_ROOT }}/nsis-installer-smoke.json
            ${{ env.SIYI_EVIDENCE_ROOT }}/msi-installer-smoke.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $metadataArguments = @('--release')
          if ($version.StartsWith('16.')) { $metadataArguments += '--accepted-snapshot' }
          siyi/.venv/Scripts/python scripts/check-release-metadata.py @metadataArguments
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata failed immediately before publication.' }
          siyi/.venv/Scripts/python scripts/check-release-evidence.py --evidence-root $env:SIYI_EVIDENCE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Release evidence failed immediately before publication.' }
          if ($version.StartsWith('16.')) {
            siyi/.venv/Scripts/python scripts/rc_gate.py --bundle "$env:SIYI_EVIDENCE_ROOT/accepted/rc-bundle.json" --model-identity "$env:SIYI_EVIDENCE_ROOT/accepted/default-model-identity.json"
            if ($LASTEXITCODE -ne 0) { throw 'Total v16 RC gate failed immediately before publication.' }
          }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { throw "GitHub release $env:GITHUB_REF_NAME already exists; refusing to replace it." }

          $nsisEvidence = Get-Content (Join-Path $env:SIYI_EVIDENCE_ROOT 'nsis-installer-smoke.json') -Raw | ConvertFrom-Json
          $msiEvidence = Get-Content (Join-Path $env:SIYI_EVIDENCE_ROOT 'msi-installer-smoke.json') -Raw | ConvertFrom-Json
          $nsis = Get-Item (Join-Path 'desktop/src-tauri/target/release/bundle/nsis' $nsisEvidence.artifacts.candidate.name)
          $msi = Get-Item (Join-Path 'desktop/src-tauri/target/release/bundle/msi' $msiEvidence.artifacts.candidate.name)

          $releaseDirectory = New-Item -ItemType Directory -Force -Path "dist/release"
          $nsisAsset = Join-Path $releaseDirectory.FullName "Siyi_${version}_x64-setup.exe"
          $msiAsset = Join-Path $releaseDirectory.FullName "Siyi_${version}_x64_zh-CN.msi"
          Copy-Item -LiteralPath $nsis.FullName -Destination $nsisAsset -Force
          Copy-Item -LiteralPath $msi.FullName -Destination $msiAsset -Force
          $assets = @(
            $nsisAsset
            $msiAsset
            (Resolve-Path "dist/release/agent-sbom.cdx.json").Path
            (Resolve-Path "dist/release/THIRD_PARTY_NOTICES.txt").Path
            (Resolve-Path (Join-Path $env:SIYI_EVIDENCE_ROOT 'nsis-installer-smoke.json')).Path
            (Resolve-Path (Join-Path $env:SIYI_EVIDENCE_ROOT 'msi-installer-smoke.json')).Path
          )
          gh release create "${{ github.ref_name }}" @assets --verify-tag --generate-notes --title "司忆 ${{ github.ref_name }}"

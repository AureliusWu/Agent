name: Release Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare locked toolchain
        run: |
          python scripts/check-release-metadata.py
          python -m venv backend/.venv
          backend/.venv/Scripts/python -m pip install -r backend/requirements.lock
          backend/.venv/Scripts/python -m pip install --no-deps -e backend
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify release source
        run: .\scripts\test.ps1
      - name: Download accepted upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -eq '0.22.0') {
            Write-Host 'The current release is the upgrade baseline.'
            exit 0
          }
          $directory = Join-Path $PWD 'build\upgrade-baseline'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          gh release download v1.0.0 --pattern 'Agent_1.0.0_*-setup.exe' --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the v1.0.0 upgrade baseline.' }
          $installer = Get-ChildItem -LiteralPath $directory -Filter 'Agent_1.0.0_*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The v1.0.0 upgrade baseline installer is missing.' }
          "AGENT_PREVIOUS_INSTALLER=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and smoke Windows packages
        run: .\scripts\build-desktop.ps1 -PreviousInstaller $env:AGENT_PREVIOUS_INSTALLER
      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Siyi-Windows-${{ github.ref_name }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
            dist/release/agent-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $assets = @(
            (Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/司忆_${version}_*-setup.exe").FullName
            (Get-ChildItem "frontend/src-tauri/target/release/bundle/msi/司忆_${version}_*.msi").FullName
            (Resolve-Path "dist/release/agent-sbom.cdx.json").Path
          )
          gh release create "${{ github.ref_name }}" @assets --verify-tag --generate-notes --title "司忆 ${{ github.ref_name }}"

name: Release Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare locked toolchain
        run: |
          python scripts/check-release-metadata.py
          python -m venv backend/.venv
          backend/.venv/Scripts/python -m pip install -r backend/requirements.lock
          backend/.venv/Scripts/python -m pip install --no-deps -e backend
      - name: Verify release source
        run: .\scripts\test.ps1
      - name: Build and smoke Windows packages
        run: .\scripts\build-desktop.ps1
      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Agent-Windows-${{ github.ref_name }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
            dist/release/agent-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $assets = @(
            (Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/Agent_${version}_*-setup.exe").FullName
            (Get-ChildItem "frontend/src-tauri/target/release/bundle/msi/Agent_${version}_*.msi").FullName
            (Resolve-Path "dist/release/agent-sbom.cdx.json").Path
          )
          gh release create "${{ github.ref_name }}" @assets --verify-tag --generate-notes --title "Agent ${{ github.ref_name }}"

name: Observe isolated Windows desktop candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main SHA for this non-release desktop observation
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-candidate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build candidate
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.payload.outputs.artifact-id }}
    steps:
      - name: Require explicit own-main hosted dispatch
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:INPUT_SOURCE_SHA -cne $env:GITHUB_SHA) { throw 'Exact current dispatch SHA required' }
          if ($env:GITHUB_REPOSITORY -cne 'AureliusWu/Agent' -or $env:GITHUB_REF -cne 'refs/heads/main' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') { throw 'Only explicit own-main dispatch is allowed' }
          if ($env:GITHUB_WORKFLOW_REF -cne 'AureliusWu/Agent/.github/workflows/rc-desktop-candidate.yml@refs/heads/main') { throw 'Unexpected workflow source' }
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'Fresh GitHub-hosted runner required' }
      - name: Keep source bytes stable across fresh Windows jobs
        run: git config --global core.autocrlf true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: siyi/requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Prepare locked candidate build dependencies
        run: |
          python -m venv siyi/.venv
          if ($LASTEXITCODE -ne 0) { throw 'Isolated build venv creation failed' }
          & ./siyi/.venv/Scripts/python.exe -m pip install --disable-pip-version-check -r siyi/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked Python dependencies failed' }
          & ./siyi/.venv/Scripts/python.exe -m pip install --no-build-isolation --no-deps -e siyi
          if ($LASTEXITCODE -ne 0) { throw 'Local backend package preparation failed' }
          npm --prefix desktop/frontend ci
          if ($LASTEXITCODE -ne 0) { throw 'Locked frontend preparation failed' }
          cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Locked Cargo preparation failed' }
      - name: Build and validate the non-release candidate closure
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: ./siyi/.venv/Scripts/python.exe -B scripts/collect-rc-desktop-candidate.py build
      - name: Upload only the validated candidate payload
        id: payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Siyi-Desktop-Candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-payload
          path: ${{ runner.temp }}/candidate-public/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve only the typed failure projection
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Siyi-Desktop-Failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-build
          path: ${{ runner.temp }}/desktop-failure-public/failure.json
          if-no-files-found: ignore
          retention-days: 7

  installed:
    name: Installed lifecycle (${{ matrix.kind }})
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [nsis, msi]
    steps:
      - name: Require explicit own-main hosted dispatch
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:INPUT_SOURCE_SHA -cne $env:GITHUB_SHA) { throw 'Exact current dispatch SHA required' }
          if ($env:GITHUB_REPOSITORY -cne 'AureliusWu/Agent' -or $env:GITHUB_REF -cne 'refs/heads/main' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') { throw 'Only explicit own-main dispatch is allowed' }
          if ($env:GITHUB_WORKFLOW_REF -cne 'AureliusWu/Agent/.github/workflows/rc-desktop-candidate.yml@refs/heads/main') { throw 'Unexpected workflow source' }
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'Fresh GitHub-hosted runner required' }
      - name: Keep source bytes stable across fresh Windows jobs
        run: git config --global core.autocrlf true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare the locked historical onefile reader
        run: |
          $reader = Join-Path $env:RUNNER_TEMP 'desktop-reader-venv'
          python -m venv $reader
          if ($LASTEXITCODE -ne 0) { throw 'Private reader venv creation failed' }
          & "$reader/Scripts/python.exe" -m pip install --disable-pip-version-check --no-deps pyinstaller==6.21.0 altgraph==0.17.5 packaging==26.2 pefile==2024.8.26 pyinstaller-hooks-contrib==2026.6 pywin32-ctypes==0.2.3 setuptools==83.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Locked historical reader preparation failed' }
          & "$reader/Scripts/python.exe" -c 'from PyInstaller.archive.readers import CArchiveReader; from PyInstaller.loader.pyimod01_archive import ArchiveReadError'
          if ($LASTEXITCODE -ne 0) { throw 'Historical onefile reader is unavailable' }
      - name: Observe the real owned installed lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: '& "$env:RUNNER_TEMP/desktop-reader-venv/Scripts/python.exe" -B scripts/collect-rc-desktop-candidate.py ${{ matrix.kind }} --artifact-id "$env:CANDIDATE_ARTIFACT_ID"'
      - name: Upload only the typed installed evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Siyi-Desktop-Candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/${{ matrix.kind }}-public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve only the typed failure projection
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Siyi-Desktop-Failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/desktop-failure-public/failure.json
          if-no-files-found: ignore
          retention-days: 7

  summarize:
    name: Validate observed desktop subset
    needs: [build, installed]
    if: ${{ success() && needs.build.result == 'success' && needs.installed.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Require explicit own-main hosted dispatch
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:INPUT_SOURCE_SHA -cne $env:GITHUB_SHA) { throw 'Exact current dispatch SHA required' }
          if ($env:GITHUB_REPOSITORY -cne 'AureliusWu/Agent' -or $env:GITHUB_REF -cne 'refs/heads/main' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') { throw 'Only explicit own-main dispatch is allowed' }
          if ($env:GITHUB_WORKFLOW_REF -cne 'AureliusWu/Agent/.github/workflows/rc-desktop-candidate.yml@refs/heads/main') { throw 'Unexpected workflow source' }
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'Fresh GitHub-hosted runner required' }
      - name: Keep source bytes stable across fresh Windows jobs
        run: git config --global core.autocrlf true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate both real installed streams with the original desktop consumer
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: python -B scripts/collect-rc-desktop-candidate.py summarize --artifact-id "$env:CANDIDATE_ARTIFACT_ID"
      - name: Upload the desktop subset result
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Siyi-Desktop-Subset-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-summary-public/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve only the typed failure projection
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Siyi-Desktop-Failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-summarize
          path: ${{ runner.temp }}/desktop-failure-public/failure.json
          if-no-files-found: ignore
          retention-days: 7

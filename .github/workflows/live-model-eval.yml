name: Live model eval

on:
  workflow_dispatch:
    inputs:
      label:
        description: Evaluation label
        required: false
        default: manual-live-sample

jobs:
  sample:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run three-task live model sample
        working-directory: backend
        env:
          AGENT_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          python -m app.evals.cli run
          --label "${{ inputs.label }}"
          --mode live_model
          --suite core
          --task project-structure
          --task fix-clear-bug
          --task honest-block
          --output data/evals
      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: live-model-eval-${{ github.run_id }}
          path: backend/data/evals
          retention-days: 14

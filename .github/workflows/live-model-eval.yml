name: Live model eval

on:
  workflow_dispatch:
    inputs:
      label:
        description: Evaluation label
        required: false
        default: manual-live-sample

jobs:
  sample:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run three-task live model sample
        working-directory: backend
        env:
          AGENT_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          python -m app.evals.cli run
          --label "${{ inputs.label }}"
          --mode live_model
          --suite core
          --task project-structure
          --task fix-clear-bug
          --task honest-block
          --output data/evals
      - name: Verify private eval output stays local to the runner
        working-directory: backend
        run: |
          if (-not (Test-Path data/evals)) { throw 'Expected the private eval output directory.' }
          Write-Host 'Live evaluation completed. Raw model output is intentionally not uploaded.'

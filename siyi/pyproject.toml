[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aureliuswu-agent-backend"
version = "14.0.0"
description = "Workspace-sandboxed personal Agent API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.32",
  "pillow==12.3.0",
  "pypdf==6.14.2",
  "pypdfium2==5.12.1",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "reportlab==5.0.0",
  "faster-whisper==1.2.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==6.2.1", "pyinstaller>=6.14,<7"]

[project.scripts]
agent-eval = "app.evals.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
markers = [
  "local_model: requires an explicitly selected local Ollama runtime",
  "paid_model: requires explicit authorization for a paid model call",
]
addopts = "-ra --cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
